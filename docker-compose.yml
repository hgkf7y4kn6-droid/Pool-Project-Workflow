# Local infrastructure: Postgres, Redis and S3-compatible storage (MinIO).
#   docker compose up -d                    # infra only; run API/worker with npm
#   docker compose --profile stack up -d    # also the production images (API + worker)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pool_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/pool-pm-files; exit 0"
  # --- production images, built from ./Dockerfile -------------------------
  migrate:
    profiles: [stack]
    build: { context: ., target: api }
    command: ["node", "dist/migrate.js"]
    environment: &backend-env
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pool_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-jwt-secret-change-me-0123456789abcdef
      DATA_ENCRYPTION_KEY: ZGV2LW9ubHktZGF0YS1rZXktMzItYnl0ZXMtbG9uZyE=
      PUBLIC_API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
    depends_on:
      postgres: { condition: service_healthy }
  api:
    profiles: [stack]
    build: { context: ., target: api }
    environment: *backend-env
    ports: ["4000:4000"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
  worker:
    profiles: [stack]
    build: { context: ., target: worker }
    environment: *backend-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
volumes:
  storage:
  pgdata:
  miniodata:

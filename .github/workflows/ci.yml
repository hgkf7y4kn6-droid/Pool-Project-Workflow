name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pool_test
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run typecheck lint
      - run: npx turbo run test --concurrency=1
      - name: Migrations are in sync with the schema
        run: |
          npm run generate -w @pool/database -- --name=ci_check
          if [ -n "$(git status --porcelain packages/database/migrations)" ]; then
            echo "::error::schema.ts changed without a generated migration. Run npm run db:generate and commit it."
            git status --porcelain packages/database/migrations
            exit 1
          fi
      - name: Dependency audit
        # Blocks on critical. High findings that remain come from Expo build tooling reached through
        # drizzle-orm's optional expo-sqlite peer; they are listed here and tracked in the audit doc.
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reports high findings; review the log"
          npm audit --omit=dev --audit-level=critical
      - name: Backend bundles build
        run: npm run build -w @pool/api && npm run build -w @pool/worker

  crew:
    name: CrewAI service (pytest + API contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The API test runner's global setup migrates a database, even for the contract test.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/crew
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pool_test
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_TRACING_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/crew/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - name: API ↔ service contract (scripted model, no network)
        run: |
          python -m tests.serve_scripted 8765 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          cd ../api && CREW_CONTRACT_URL=http://127.0.0.1:8765 npx vitest run test/crew-contract.test.ts
        working-directory: services/crew
        shell: bash

  e2e:
    name: End-to-end (web build + API + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pool_e2e
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run build:web -w @pool/e2e
      - run: npm run test:e2e -w @pool/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Backend images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha

name: Deploy

# Staging deploys automatically, but only after the CI workflow succeeds on main
# (workflow_run), and always the commit CI tested. Production is manual dispatch.
# Each target is a GitHub Environment with its own secrets and protection rules:
#   MIGRATION_DATABASE_URL — direct/session connection used only by the migration step
#   DATABASE_SSL_CA    — Supabase CA certificate (base64) for verify-full TLS
#   DEPLOY_HOOK_URL    — your platform's deploy hook (Render, Fly, ECS, k8s, ...)
#   EXPO_TOKEN         — EAS builds / OTA updates
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [development, staging, production]
        default: staging
      mobile:
        description: Also ship the mobile app (EAS update; build when native code changed)
        type: choice
        options: [none, update, build]
        default: update

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  # workflow_run starts from the default branch head; deploy the commit CI actually tested.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TARGET: ${{ inputs.environment || 'staging' }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/pool

jobs:
  images:
    # A failed or cancelled CI run never deploys. Manual dispatch is the operator's explicit choice.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: meta
        run: echo "tag=${DEPLOY_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

  migrate:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Migrations are forward-only and must be backward compatible with the
      # previous release (expand → deploy → contract), so they run first.
      - name: Apply database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_SSL: verify-full
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
        run: docker run --rm -e MIGRATION_DATABASE_URL -e DATABASE_SSL -e DATABASE_SSL_CA "${IMAGE_PREFIX}-api:${{ needs.images.outputs.tag }}" node dist/migrate.js

  rollout:
    needs: [images, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Trigger platform deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::DEPLOY_HOOK_URL is not set for $TARGET; images were pushed with tag $TAG but nothing was rolled out."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" -H 'content-type: application/json' \
            -d "{\"api\":\"${IMAGE_PREFIX}-api:${TAG}\",\"worker\":\"${IMAGE_PREFIX}-worker:${TAG}\"}"
      - name: Smoke test
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::vars.API_URL is not set for $TARGET; cannot confirm the rollout."
            exit 1
          fi
          for i in $(seq 1 30); do
            curl -fsS "$API_URL/health/ready" && exit 0
            sleep 10
          done
          echo "::error::API did not become ready"; exit 1

  mobile:
    needs: rollout
    if: (inputs.mobile || 'update') != 'none'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: OTA update (JS-only changes)
        if: (inputs.mobile || 'update') == 'update'
        # EAS environments are development / preview / production; staging builds use "preview".
        run: |
          EAS_ENV=$([ "$TARGET" = staging ] && echo preview || echo "$TARGET")
          eas update --channel "$TARGET" --environment "$EAS_ENV" --message "${DEPLOY_SHA::12}" --non-interactive
      - name: Store build (native changes)
        if: inputs.mobile == 'build'
        run: eas build --platform all --profile "$TARGET" --non-interactive --no-wait
